AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  aws-backend-python

  Sample SAM Template for aws-backend-python

Parameters:
  PythonRuntime:
    Type: String

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: !Ref PythonRuntime
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: INFO
    Environment:
      Variables:
        PMID_TABLE_NAME: !Ref PmidTablev4
        SEARCH_CACHE_TABLE_NAME: !Ref SearchCache
        DOI2PMID_TABLE_NAME: !Ref Doi2Pmid
        DOI2ADS_TABLE_NAME: !Ref Doi2Ads
        PMID_LOOKUP_QUEUE_URL: !Ref PmidLookupQueue
        PMID_DOI_LOOKUP_QUEUE_URL: !Ref PmidDoiLookupQueue
        ADS_DOI_LOOKUP_QUEUE_URL: !Ref AdsDoiLookupQueue

Resources:
  PmidLookupQueue:
    Type: AWS::SQS::Queue
  PmidLookupQueue:
    Type: AWS::SQS::Queue
  AdsDoiLookupQueue:
    Type: AWS::SQS::Queue
  PmidTablev4:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pmid
          AttributeType: S
      KeySchema:
        - AttributeName: pmid
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
  SearchCache:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: url
          AttributeType: S
      KeySchema:
        - AttributeName: url
          KeyType: HASH
  Doi2Pmid:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: doi
          AttributeType: S
      KeySchema:
        - AttributeName: doi
          KeyType: HASH
  Doi2Ads:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: doi
          AttributeType: S
      KeySchema:
        - AttributeName: doi
          KeyType: HASH
  IndexFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: jinja2/
      Handler: src.index.lambda_handler
      Architectures:
        - x86_64
      Events:
        E1:
          Type: HttpApi
          Properties:
            Path: /
            Method: get
  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: jinja2/
      Handler: src.search.lambda_handler
      Architectures:
        - x86_64
      Timeout: 900 # seconds (max 900)
      MemorySize: 1769 # MB (128–10240)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PmidTablev4
        - DynamoDBCrudPolicy:
            TableName: !Ref SearchCache
        - DynamoDBCrudPolicy:
            TableName: !Ref Doi2Pmid
        - DynamoDBCrudPolicy:
            TableName: !Ref Doi2Ads
        - SQSSendMessagePolicy:
            QueueName: !Ref PmidLookupQueue
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: arn:aws:ssm:eu-central-1:796401245269:parameter/api-token/api.adsabs.harvard.edu/georgwendorf_gmail.com
      Events:
        E1:
          Type: HttpApi
          Properties:
            Path: /search
            Method: get
  DoiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: jinja2/
      Handler: src.doi.lambda_handler
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PmidTablev4
        - DynamoDBCrudPolicy:
            TableName: !Ref Doi2Ads
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: arn:aws:ssm:eu-central-1:796401245269:parameter/api-token/api.adsabs.harvard.edu/georgwendorf_gmail.com
      Events:
        E1:
          Type: HttpApi
          Properties:
            Path: /doi.org/{doi+}
            Method: get
  PmidFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: jinja2/
      Handler: src.pmid.lambda_handler
      Architectures:
        - x86_64
      Events:
        E1:
          Type: HttpApi
          Properties:
            Path: /pubmed.ncbi.nlm.nih.gov/{pmid}
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PmidTablev4
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: arn:aws:ssm:eu-central-1:796401245269:parameter/api-token/api.adsabs.harvard.edu/georgwendorf_gmail.com
  BibCodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: jinja2/
      Handler: src.bibcode.lambda_handler
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PmidTablev4
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: arn:aws:ssm:eu-central-1:796401245269:parameter/api-token/api.adsabs.harvard.edu/georgwendorf_gmail.com
      Events:
        E1:
          Type: HttpApi
          Properties:
            Path: /ui.adsabs.harvard.edu/abs/{bibcode}
            Method: get
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: nodeps/
      Handler: src.auth.lambda_handler
      Architectures:
        - x86_64
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: arn:aws:ssm:eu-central-1:796401245269:parameter/oauth2/orcid.org/0000-0003-2213-3552/APP-6KSLC9TDGOYVUOTT
      Events:
        Auth:
          Type: HttpApi
          Properties:
            Path: /auth
            Method: get

  CallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: nodeps/
      Handler: src.callback.lambda_handler
      Architectures:
        - x86_64
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: arn:aws:ssm:eu-central-1:796401245269:parameter/oauth2/orcid.org/0000-0003-2213-3552/APP-6KSLC9TDGOYVUOTT
      Events:
        Callback:
          Type: HttpApi
          Properties:
            Path: /callback
            Method: get

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: nodeps/
      Handler: src.logout.lambda_handler
      Architectures:
        - x86_64
      Events:
        Logout:
          Type: HttpApi
          Properties:
            Path: /logout
            Method: get
  StreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: nodeps/
      Handler: src.dydb.lambda_handler
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt PmidTablev4.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 100
            Enabled: true

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
